[project]
name = "boiler-guard"
version = "0.1.0"
description = "Turn the boiler's Shelly plug off when the Deye inverter loses grid"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "workers-py==1.17.8",
    "uv==0.13.1",
    "ruff==0.17.1",
    "shellcheck-py==0.11.0.1",
    "actionlint-py==1.7.12.25",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, bandit (security), pyupgrade, import order
select = ["F", "E", "W", "B", "S", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E402"]   # unittest asserts; sys.path tweak before imports
"scripts/hooks/pre-commit" = ["S603", "S607"]  # fixed git argv, no shell
