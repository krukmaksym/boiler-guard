name = "boiler-guard"
main = "src/entry.py"
compatibility_date = "2026-10-01"
compatibility_flags = ["python_workers"]

# workers.dev URL for the optional Telegram webhook. Without TELEGRAM_WEBHOOK_SECRET
# every request gets a 404; with it, only requests passing src/webhook.py's checks
# are handled. Preview URLs stay off.
workers_dev = true
preview_urls = false

[triggers]
crons = ["* * * * *"]

# Holds the auto-refreshed Deye token, notification dedup state and Telegram
# bookkeeping (update offset, webhook replay guard, status cooldowns). The plug state
# lived here too until PlugState took it over; those old values are left in place.
# Credentials live in Worker Secrets (see scripts/upload-secrets.sh).
[[kv_namespaces]]
binding = "STATE"
id = "ab7e5c69f89f42c7af5243d5de4f6c41"

# The plug state (desired state, the admin's hold, the switch-on cooldown): a
# strongly consistent Durable Object (src/entry.py PlugState), one object per Worker.
[[durable_objects.bindings]]
name = "PLUG"
class_name = "PlugState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlugState"]

# Non-secret settings.
[vars]
DEYE_BASE_URL = "https://eu1-developer.deyecloud.com"
GRID_VOLTAGE_KEY = "GridVoltageL1L2"
BACKUP_LOAD_KEY = "UPSLoadPower"
BATTERY_POWER_KEY = "BatteryPower"  # Deye's sign: negative while charging
BATTERY_VOLTAGE_KEY = "BatteryVoltage"
GRID_RELAY_KEY = "GridRelayStatus"  # "Pull-in" on grid, "Break" off grid (boiler off)
ON_VOLTAGE = "210"
OFF_VOLTAGE = "205"
# The inverter's grid limits: above HIGH_OFF_VOLTAGE ("Grid V High (Normal)") it opens
# its grid relay, and reconnects only at HIGH_ON_VOLTAGE ("Grid V High (Reconnect)") or
# below; the boiler follows. OFF_VOLTAGE/ON_VOLTAGE are stricter than its low limits.
HIGH_ON_VOLTAGE = "255"
HIGH_OFF_VOLTAGE = "265"
# After any switch-off (outage or low/high voltage), the voltage must stay in range this long
# before the boiler switches back on (0 = no wait).
VOLTAGE_COOLDOWN_SECONDS = "600"
MAX_DATA_AGE_SECONDS = "180"
SHELLY_CHANNEL = "0"

[observability]
enabled = true

# --- boiler-guard-test: for verifying changes with the test bot and test group ---
# Never deployed by CI. Exists only while verifying: scripts/test-env.sh up deploys
# it with EXPIRES_AT (it does nothing at all after that time), and
# scripts/test-env.sh down deletes the Worker and its webhook.
# vars and kv_namespaces are not inherited by environments, so they are repeated.
[env.test]
name = "boiler-guard-test"
workers_dev = true
preview_urls = false

[env.test.triggers]
crons = ["* * * * *"]

[[env.test.kv_namespaces]]
binding = "STATE"
id = "9f2e8f04da484c3abd920fa5945e718b"

# The test Worker's own plug state (durable_objects and migrations are not inherited).
[[env.test.durable_objects.bindings]]
name = "PLUG"
class_name = "PlugState"

# Production's plug state, read only for its manual-off hold (src/entry.py
# prod_held_off): both Workers switch the same real plug, so the test one must
# never switch on a boiler the production admin holds off. The code never writes it.
[[env.test.durable_objects.bindings]]
name = "PROD_PLUG"
class_name = "PlugState"
script_name = "boiler-guard"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["PlugState"]

[env.test.vars]
ENVIRONMENT = "test"  # makes EXPIRES_AT mandatory: without it the Worker never runs
NOTIFY_PREFIX = "🧪 ТЕСТ: "
DEYE_BASE_URL = "https://eu1-developer.deyecloud.com"
GRID_VOLTAGE_KEY = "GridVoltageL1L2"
BACKUP_LOAD_KEY = "UPSLoadPower"
BATTERY_POWER_KEY = "BatteryPower"  # Deye's sign: negative while charging
BATTERY_VOLTAGE_KEY = "BatteryVoltage"
GRID_RELAY_KEY = "GridRelayStatus"  # "Pull-in" on grid, "Break" off grid (boiler off)
ON_VOLTAGE = "210"
OFF_VOLTAGE = "205"
# The inverter's grid limits: above HIGH_OFF_VOLTAGE ("Grid V High (Normal)") it opens
# its grid relay, and reconnects only at HIGH_ON_VOLTAGE ("Grid V High (Reconnect)") or
# below; the boiler follows. OFF_VOLTAGE/ON_VOLTAGE are stricter than its low limits.
HIGH_ON_VOLTAGE = "255"
HIGH_OFF_VOLTAGE = "265"
# After any switch-off (outage or low/high voltage), the voltage must stay in range this long
# before the boiler switches back on (0 = no wait).
VOLTAGE_COOLDOWN_SECONDS = "600"
MAX_DATA_AGE_SECONDS = "180"
SHELLY_CHANNEL = "0"

[env.test.observability]
enabled = true
